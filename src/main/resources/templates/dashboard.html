<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>TradeLog Sentinel Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #555;
            font-size: 14px;
        }

        .metric {
            font-size: 28px;
            font-weight: bold;
        }

        .critical {
            color: #c0392b;
        }

        .high {
            color: #e67e22;
        }

        .medium {
            color: #f1c40f;
        }

        .low {
            color: #27ae60;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #2c3e50;
            color: white;
            text-align: left;
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f2f2f2;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-INFO {
            background-color: #3498db;
        }

        .badge-WARNING {
            background-color: #f39c12;
        }

        .badge-ERROR {
            background-color: #e74c3c;
        }

        .badge-CRITICAL {
            background-color: #8e1b1b;
        }

        .alert-item {
            padding: 10px;
            border-left: 5px solid #e74c3c;
            background-color: #fff5f5;
            margin-bottom: 8px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<h1>TradeLog Sentinel Dashboard</h1>
<p class="subtitle">Backend monitoring dashboard for log analysis and risk detection</p>

<div class="dashboard-grid">

    <div class="card">
        <h3>Risk Level</h3>
        <div class="metric"
             th:text="${risk.riskLevel}"
             th:classappend="${risk.riskLevel == 'CRITICAL'} ? ' critical' :
                             (${risk.riskLevel == 'HIGH'} ? ' high' :
                             (${risk.riskLevel == 'MEDIUM'} ? ' medium' : ' low'))">
        </div>
    </div>

    <div class="card">
        <h3>Total Severity Score</h3>
        <div class="metric" th:text="${risk.totalSeverityScore}"></div>
    </div>

    <div class="card">
        <h3>Error Logs</h3>
        <div class="metric" th:text="${summary['ERROR']}"></div>
    </div>

    <div class="card">
        <h3>Critical Logs</h3>
        <div class="metric critical" th:text="${summary['CRITICAL']}"></div>
    </div>

</div>

<div class="section">
    <h2>Log Summary</h2>
    <p>INFO: <strong th:text="${summary['INFO']}"></strong></p>
    <p>WARNING: <strong th:text="${summary['WARNING']}"></strong></p>
    <p>ERROR: <strong th:text="${summary['ERROR']}"></strong></p>
    <p>CRITICAL: <strong th:text="${summary['CRITICAL']}"></strong></p>
</div>

<div class="section">
    <h2>Suspicious Alerts</h2>

    <div th:if="${#lists.isEmpty(alerts)}">
        No suspicious alerts detected.
    </div>

    <div class="alert-item" th:each="alert : ${alerts}">
        <strong th:text="${alert.level}"></strong>
        -
        <span th:text="${alert.message}"></span>
    </div>
</div>

<div class="section">
    <h2>Recent Logs</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Level</th>
            <th>Message</th>
            <th>Timestamp</th>
        </tr>

        <tr th:each="log : ${logs}">
            <td th:text="${log.id}"></td>
            <td>
                <span class="badge"
                      th:classappend="' badge-' + ${log.level}"
                      th:text="${log.level}">
                </span>
            </td>
            <td th:text="${log.message}"></td>
            <td th:text="${log.timestamp}"></td>
        </tr>
    </table>
</div>

</body>
</html>
